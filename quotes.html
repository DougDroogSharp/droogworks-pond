<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Droog's Pad — Voice Notes</title>
<style>
:root{--void:#12101a;--panel:#1b1826;--line:#3a3350;--paper:#F2EEE6;--dim:#A79EBC;--accent:#8FD3B0;--danger:#e08f8f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--void);color:var(--paper);font:17px/1.55 Georgia,'Iowan Old Style',serif;padding-bottom:90px}
header{max-width:900px;margin:0 auto;padding:26px 18px 10px}
.back{font:13px -apple-system,Helvetica,Arial,sans-serif;color:var(--accent);text-decoration:none;letter-spacing:.06em}
h1{font-size:34px;font-weight:normal;letter-spacing:2px;margin-top:8px}
h1 em{font-style:normal;color:var(--accent)}
.sub{color:var(--dim);font:13.5px -apple-system,Helvetica,Arial,sans-serif;margin-top:6px}
.tools{max-width:900px;margin:14px auto 0;padding:0 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#q{flex:1;min-width:220px;background:var(--panel);border:1.5px solid var(--line);color:var(--paper);border-radius:12px;padding:12px 14px;font:16px Georgia,serif}
.tbtn{background:none;border:1.5px solid var(--line);color:var(--dim);border-radius:999px;padding:9px 14px;cursor:pointer;font:12.5px -apple-system,Helvetica,Arial,sans-serif}
.tbtn.on{border-color:var(--accent);color:var(--accent)}
main{max-width:900px;margin:8px auto 0;padding:0 18px}
.grp{margin-top:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.grp>summary::-webkit-details-marker{display:none}
.gname{font-size:19px}
.gcount{font:12px -apple-system,sans-serif;color:var(--dim);white-space:nowrap}
.qrow{display:flex;gap:8px;align-items:flex-start;padding:10px 14px;border-top:1px solid rgba(58,51,80,.55)}
.qtext{flex:1;min-width:0;font-size:16.5px}
.qtext .tagline{display:block;font:11.5px -apple-system,sans-serif;color:var(--dim);margin-top:3px}
.qbtn{flex:none;width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:none;color:var(--dim);cursor:pointer;font-size:15px;line-height:1}
.qbtn:active{border-color:var(--accent);color:var(--accent)}
.qbtn.play[disabled]{opacity:.35;cursor:default}
.qbtn.trash:active{border-color:var(--danger);color:var(--danger)}
.qsel.also{max-width:92px;color:var(--accent);opacity:.85}
.chip2{margin:4px 6px 0 0;background:none;border:1px solid var(--line);color:var(--accent);border-radius:999px;padding:3px 9px;font:10.5px -apple-system,sans-serif;cursor:pointer}
.qsel{flex:none;max-width:150px;height:38px;background:var(--void);border:1.5px solid var(--line);color:var(--dim);border-radius:10px;font:12px -apple-system,sans-serif;padding:0 6px}
.dead .qtext{opacity:.38;text-decoration:line-through;text-decoration-thickness:1px}
.moved{font:10.5px -apple-system,sans-serif;color:var(--accent)}
#retag{position:fixed;inset:0;background:rgba(10,8,16,.9);display:none;align-items:center;justify-content:center;padding:20px;z-index:60}
#retag .box{background:var(--panel);border:1.5px solid var(--accent);border-radius:16px;padding:20px;max-width:420px;width:100%}
#retag h2{font-size:18px;margin-bottom:10px;font-weight:normal}
#retag select{width:100%;background:var(--void);color:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px;font:16px Georgia,serif}
#retag .row{display:flex;gap:10px;margin-top:14px}
#retag button{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:none;color:var(--paper);cursor:pointer;font:14px -apple-system,sans-serif}
#retag button.go{border-color:var(--accent);color:var(--accent)}
footer{max-width:900px;margin:26px auto 0;padding:0 18px;color:var(--dim);font:12px -apple-system,sans-serif}
</style>
</head>
<body>
<header>
  <a class="back" href="/">&#8592; back to the pad</a>
  <h1>VOICE <em>NOTES</em></h1>
  <div class="sub" id="sub">loading the croakery&hellip;</div>
</header>

<div class="tools">
  <input id="q" type="search" placeholder="Search the quotes&hellip;">
  <button class="tbtn" id="showDead" onclick="toggleDead()">show trashed</button>
  <button class="tbtn" onclick="exportCuration()">copy curation</button>
</div>

<main id="groups"></main>

<div id="retag"><div class="box">
  <h2>Move this quote to&hellip;</h2>
  <select id="retagSel"></select>
  <div class="row">
    <button onclick="closeRetag()">cancel</button>
    <button class="go" onclick="applyRetag()">move it</button>
  </div>
</div></div>

<footer>Trash and moves are saved in this browser. "Copy curation" hands your rulings to Claude to make permanent. Play buttons light up as the Librarian wires audio. All six slices are in — the dictaphone archive is fully shelved.</footer>

<script>
const CKEY='pad-quotes-curation-v1';
let DATA=null, CUR=JSON.parse(localStorage.getItem(CKEY)||'{}'), showDeadFlag=false, retagId=null;
const NAMES={'unassigned':'Unassigned — the idea bins','chaff':'Chaff — to-do bins, deep thoughts, politics','cpsf':'CPSF — Central Pain Syndrome Foundation','divorce':'Divorce — diary shelf','bushville':'Bushville','droogs-pad':"Droog's Pad",'phrog':'Phrog','time-toilet':'Time Toilet','brainrot-for-ais':'Brainrot for AIs','gods-nuke':"God's Nuke",'diary':'Diary','tale-of-george-bushytail':'Tale of George Bushytail','war-on-death':'War on Death','hels-bet':"Hel's Bet",'gospel-of-john-with-werewolf':'Gospel of John, with Werewolf','godinabox':'God in a Box','chipwits':'ChipWits','chipwits-comic':'ChipWits Comic','castle-rising':'Castle Rising','heloworld':'HeloWorld','brainrot-the-game':'Brainrot: the Game','delerium-tremens':'Delerium Tremens','dramaton':'Dramaton','channel-zilch':'Channel Zilch','squids-of-zondor':'Flying Squids of Zondor','actinic-flechettes':'Actinic Flechettes','biblehack':'BibleHack','palin-cheney-2012':'Palin-Cheney 2012','operation-american-freedom':'Operation American Freedom','bk-not-so-novel':'Bk','the-underclocked':'The Underclocked','404-god-not-found':'404: God Not Found','elves':'Elves'};
function workList(){return [...new Set([...Object.keys(NAMES),...DATA.quotes.map(x=>x.work)])].sort((a,b)=>nm(a).localeCompare(nm(b)));}
function nm(w){return NAMES[w]||w.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
function save(){localStorage.setItem(CKEY,JSON.stringify(CUR));}
function state(q){const c=CUR[q.id]||{};return {dead:!!c.dead, work:c.work||q.work, also:(c.also||[]).filter(w=>w!==(c.work||q.work))};}
fetch('quotes.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;render();jumpHash();});
function lazySel(sel, cw, s, onpick){
  sel.dataset.built='';
  const fill=()=>{ if(sel.dataset.built) return; sel.dataset.built='1';
    const keep=sel.value; sel.innerHTML='';
    if(onpick==='also'){const ph=document.createElement('option');ph.value='';ph.textContent='+ also…';sel.appendChild(ph);}
    workList().forEach(w2=>{ if(onpick==='also'&&(w2===s.work||s.also.includes(w2)))return;
      const o=document.createElement('option');o.value=w2;o.textContent=nm(w2);
      if(onpick==='home'&&w2===s.work)o.selected=true;sel.appendChild(o);});
    if(onpick==='also')sel.value='';
  };
  sel.addEventListener('mousedown',fill); sel.addEventListener('focus',fill); sel.addEventListener('touchstart',fill,{passive:true});
}
function buildRow(q){
  const s=state(q);
  const row=document.createElement('div'); row.className='qrow'+(s.dead?' dead':'');
  const t=document.createElement('div'); t.className='qtext';
  const full=q.text, CLAMP=420;
  if(full.length>CLAMP){
    t.textContent=full.slice(0,CLAMP)+'… '; 
    const more=document.createElement('a'); more.href='#'; more.textContent='[more]'; more.style.color='var(--accent)';
    more.onclick=(e)=>{e.preventDefault(); if(t.dataset.open){t.dataset.open='';t.childNodes[0].textContent=full.slice(0,CLAMP)+'… ';more.textContent='[more]';}
      else {t.dataset.open='1';t.childNodes[0].textContent=full+' ';more.textContent='[less]';}};
    t.appendChild(more);
  } else t.textContent=full;
  t.title=q.files.join('  ·  ')+'\n'+q.date+' — '+q.dur+' — slice '+q.slice;
  if(s.work!==q.work){const m=document.createElement('span');m.className='tagline moved';m.textContent='moved here from '+nm(q.work);t.appendChild(m);}
  if(s.also.length){const cw=document.createElement('span');cw.className='tagline';
    s.also.forEach(w2=>{const ch=document.createElement('button');ch.className='chip2';ch.textContent='also: '+nm(w2)+' \u2715';
      ch.onclick=()=>{CUR[q.id].also=CUR[q.id].also.filter(x=>x!==w2);save();render();};cw.appendChild(ch);});
    t.appendChild(cw);}
  const play=document.createElement('button'); play.className='qbtn play'; play.textContent='\u25B6';
  if(q.audio){play.onclick=()=>new Audio(q.audio).play();}
  else {play.disabled=true; play.title='audio not wired yet — the Librarian lights these up';}
  const tag=document.createElement('select'); tag.className='qsel'; tag.title='assigned project';
  {const o=document.createElement('option');o.value=s.work;o.textContent=nm(s.work);o.selected=true;tag.appendChild(o);}
  lazySel(tag,s.work,s,'home');
  tag.onchange=()=>{CUR[q.id]=CUR[q.id]||{};CUR[q.id].work=tag.value;save();render();};
  const also=document.createElement('select'); also.className='qsel also'; also.title='also file under…';
  {const o=document.createElement('option');o.value='';o.textContent='+ also…';also.appendChild(o);}
  lazySel(also,s.work,s,'also');
  also.onchange=()=>{if(!also.value)return;CUR[q.id]=CUR[q.id]||{};CUR[q.id].also=[...(CUR[q.id].also||[]),also.value];save();render();};
  const del=document.createElement('button'); del.className='qbtn trash'; del.textContent=s.dead?'\u21BA':'\u{1F5D1}';
  del.title=s.dead?'restore':'trash this quote';
  del.onclick=()=>{CUR[q.id]=CUR[q.id]||{};CUR[q.id].dead=!s.dead;save();render();};
  row.append(t,play,tag,also,del);
  return row;
}
let GROUPS={};
function render(){
  const openSet=new Set([...document.querySelectorAll('details.grp[open]')].map(d=>d.id));
  const scrollY=window.scrollY;
  const qstr=(document.getElementById('q').value||'').toLowerCase();
  const groups={};
  let live=0, dead=0;
  DATA.quotes.forEach(q=>{
    const s=state(q);
    if(s.dead){dead++; if(!showDeadFlag) return;} else live++;
    if(qstr && !q.text.toLowerCase().includes(qstr)) return;
    (groups[s.work]=groups[s.work]||[]).push(q);
    s.also.forEach(w2=>{(groups[w2]=groups[w2]||[]).push(q);});
    if(SOLO && s.work!==SOLO && !s.also.includes(SOLO) && (q.tags||[]).some(tg=>tg.toLowerCase().replace(/[^a-z0-9]+/g,'-')===SOLO)){
      (groups[SOLO]=groups[SOLO]||[]).push(q);
    }
  });
  GROUPS=groups;
  document.getElementById('sub').textContent = SOLO
    ? (groups[SOLO]?groups[SOLO].length:0)+' voice notes for '+nm(SOLO)+' (assigned or tagged) — '
    : live+' quotes on the shelves'+(dead?' · '+dead+' in the trash':'')+' · all six slices — the dictaphone archive, fully shelved';
  if(SOLO){const a=document.createElement('a');a.href='#';a.textContent='show all projects';a.style.color='var(--accent)';
    a.onclick=(e)=>{e.preventDefault();history.replaceState(null,'',location.pathname);SOLO=null;render();};
    document.getElementById('sub').appendChild(a);}
  document.getElementById('showDead').textContent=(showDeadFlag?'hide':'show')+' trashed ('+dead+')';
  let order=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
  if(SOLO) order=order.filter(w=>w===SOLO);
  const el=document.getElementById('groups'); el.innerHTML='';
  order.forEach(w=>{
    const det=document.createElement('details'); det.className='grp'; det.id='work-'+w;
    const sum=document.createElement('summary');
    sum.innerHTML='<span class="gname">'+nm(w)+'</span><span class="gcount">'+groups[w].length+'</span>';
    det.appendChild(sum);
    const body=document.createElement('div'); det.appendChild(body);
    const populate=()=>{ if(body.dataset.built)return; body.dataset.built='1';
      const frag=document.createDocumentFragment();
      GROUPS[w].forEach(q=>frag.appendChild(buildRow(q)));
      body.appendChild(frag); };
    det.addEventListener('toggle',()=>{ if(det.open) populate(); });
    if(qstr||SOLO||openSet.has(det.id)){ det.open=true; populate(); }
    el.appendChild(det);
  });
  window.scrollTo(0,scrollY);
}
document.getElementById('q').addEventListener('input',render);
function toggleDead(){showDeadFlag=!showDeadFlag;render();}
function openRetag(id,cw){retagId=id;const sel=document.getElementById('retagSel');sel.innerHTML='';
  const works=[...new Set([...Object.keys(NAMES),...DATA.quotes.map(x=>x.work)])].sort((a,b)=>nm(a).localeCompare(nm(b)));
  works.forEach(w=>{const o=document.createElement('option');o.value=w;o.textContent=nm(w);if(w===cw)o.selected=true;sel.appendChild(o);});
  document.getElementById('retag').style.display='flex';}
function closeRetag(){document.getElementById('retag').style.display='none';retagId=null;}
function applyRetag(){const w=document.getElementById('retagSel').value;CUR[retagId]=CUR[retagId]||{};CUR[retagId].work=w;save();closeRetag();render();}
function exportCuration(){
  const out=JSON.stringify(CUR);
  navigator.clipboard?.writeText(out).then(()=>alert('Curation copied — paste it to Claude to bake in.'),()=>prompt('Copy this:',out));
}
let SOLO=null;
function jumpHash(){
  const m=location.hash.match(/work=([a-z0-9-]+)/);
  SOLO=m?m[1]:null;
  render();
  if(SOLO){const d=document.getElementById('work-'+SOLO); if(d){d.open=true;}}
}
window.addEventListener('hashchange',jumpHash);
</script>
</body>
</html>
